<p>2.1. La mise à disposition d&#39;une salle est soumise à un <strong>minimum de consommation de 700 €</strong> (« minimum spend »). [⚠️ À VÉRIFIER — préciser : montant TTC, ce qui est décompté (boissons, restauration…), et ce qui se passe si le minimum n&#39;est pas atteint.]</p>
<p>2.2. Toute autre demande (privatisation, prestations particulières…) fait l&#39;objet d&#39;un <strong>devis</strong>.</p>
<p>2.3. Modalités de paiement : [À COMPLÉTER].</p>
<h2>3. Caution</h2>
<p>3.1. Une <strong>caution de 500 €</strong> est demandée pour toute réservation : [À COMPLÉTER — forme (chèque, empreinte bancaire…), moment du dépôt].</p>
<p>3.2. Elle est restituée [À COMPLÉTER — délai] après l&#39;état des lieux de sortie, déduction faite, sur justificatif, des sommes dues au titre des dégradations, du nettoyage exceptionnel ou du dépassement d&#39;horaire.</p>
<p>3.3. [⚠️ À VÉRIFIER — préciser les cas de retenue et la procédure en cas de désaccord.]</p>
<h2>4. Modification</h2>
<p>Toute modification (date, horaires, nombre de personnes) est à demander à QUAI 19 ; elle est acceptée selon les disponibilités.</p>
<h2>5. Annulation par le Client</h2>
<p>5.1. Une <strong>demande non encore confirmée</strong> peut être annulée <strong>sans frais</strong>.</p>
<p>5.2. Pour une <strong>réservation confirmée</strong>, des frais d&#39;annulation s&#39;appliquent selon la date d&#39;annulation par rapport au jour réservé : <strong>aucun frais à 30 jours ou plus, 25 % de 29 à 16 jours, 50 % de 15 à 8 jours, 90 % à 7 jours ou moins avant le jour réservé ; 100 % en cas d&#39;absence</strong>. [⚠️ À VÉRIFIER — base de calcul : minimum de consommation ou montant du devis.]</p>
<p>5.3. [⚠️ À VÉRIFIER avec votre juriste — pour les clients particuliers, une clause permettant de conserver des sommes sans contrepartie équivalente en cas d&#39;annulation par le professionnel est présumée abusive ; le montant des frais peut aussi être réduit par un juge s&#39;il est jugé excessif.]</p>
<h2>6. Annulation par QUAI 19</h2>
<p>En cas d&#39;annulation par QUAI 19 (force majeure, fermeture administrative, impossibilité de mettre la salle à disposition), le Client est <strong>intégralement remboursé</strong>. [⚠️ À VÉRIFIER — hors force majeure, prévoir une indemnité équivalente aux frais que le Client supporterait lui-même à la même date.]</p>
<h2>7. Utilisation de la salle</h2>
<p>7.1. Le Client respecte la capacité maximale de la salle et le <strong>règlement intérieur</strong> [À COMPLÉTER].</p>
<p>7.2. Un retard ne prolonge pas la réservation ; tout dépassement d&#39;horaire peut être facturé [À COMPLÉTER].</p>
<p>7.3. Un état des lieux est réalisé à l&#39;entrée et à la sortie [À COMPLÉTER].</p>
<h2>8. Responsabilité et assurance</h2>
<p>Le Client est responsable des dommages causés par lui-même, ses invités ou ses prestataires, et déclare être assuré en responsabilité civile. QUAI 19 n&#39;est pas responsable des vols ou pertes d&#39;objets.</p>
<h2>9. Droit de rétractation</h2>
<p>[⚠️ À VÉRIFIER avec votre juriste — professionnels : pas de droit de rétractation. Particuliers : la réservation d&#39;une salle à une date déterminée pour une activité de loisirs peut relever de l&#39;exception de l&#39;article L221-28, 12° du Code de la consommation ; à défaut, un délai de 14 jours s&#39;applique et doit être décrit ici.]</p>
<h2>10. Données personnelles</h2>
<p>Voir notre <a href="#confidentialite">politique de confidentialité</a>.</p>
<h2>11. Médiation et litiges</h2>
<p>11.1. En cas de difficulté, écrivez-nous à {{EMAIL_TEXTE}}.</p>
<p>11.2. <strong>Clients particuliers</strong> : recours gratuit possible au médiateur de la consommation : [À COMPLÉTER — nom, adresse, site]. [⚠️ Adhésion obligatoire pour vendre à des particuliers.]</p>
<p>11.3. Droit français applicable ; pour les professionnels, tribunaux de [À COMPLÉTER].</p>

<!-- ✏️ VOS COORDONNÉES : modifiez uniquement la ligne suivante (laissez "" pour masquer) -->
<script type="application/json" id="q19-state">{"email":"","telephone":""}</script>
<script id="q19-app">
(function () {
  "use strict";
  document.documentElement.lang = "fr"; // langue de la page (lecteurs d'écran, traduction automatique)
  var stateEl = document.getElementById("q19-state");
  var state = { email: "", telephone: "" };
  try { var parsed = JSON.parse(stateEl.textContent); state.email = String(parsed.email || ""); state.telephone = String(parsed.telephone || ""); } catch (e) {}
  var tpl = document.getElementById("q19-site");
  var root = document.getElementById("q19-root");
  var VIEWS = ["accueil","salles","reserver","mentions-legales","confidentialite","conditions"];

  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }

  // Remplit le gabarit avec les coordonnées actuelles
  function render() {
    var email = state.email.trim(), tel = state.telephone.trim();
    var emailTexte = email ? '<a href="mailto:' + esc(email) + '" class="selectable">' + esc(email) + "</a>" : "l'adresse e-mail indiquée en bas de page";
    root.innerHTML = tpl.innerHTML
      .split("{{EMAIL_TEXTE}}").join(emailTexte)
      .split("{{EMAIL_HREF}}").join(esc("mailto:" + email))
      .split("{{EMAIL}}").join(esc(email))
      .split("{{TEL_HREF}}").join(esc("tel:" + tel.replace(/[^0-9+]/g, "")))
      .split("{{TEL}}").join(esc(tel));
    root.querySelectorAll('[data-si="email"]').forEach(function (el) { el.hidden = !email; });
    root.querySelectorAll('[data-si="tel"]').forEach(function (el) { el.hidden = !tel; });
    root.querySelectorAll('[data-si="contact"]').forEach(function (el) { el.hidden = !email && !tel; });
    show(false);
  }

  // Affiche la rubrique correspondant à l'adresse (#salles, #reserver…)
  function show(moveFocus) {
    var name = location.hash.slice(1);
    if (VIEWS.indexOf(name) === -1) name = "accueil";
    root.querySelectorAll(".view").forEach(function (v) { v.hidden = v.getAttribute("data-view") !== name; });
    root.querySelectorAll("[data-nav]").forEach(function (a) {
      if (a.getAttribute("data-nav") === name) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
    });
    document.title = name === "accueil" ? "QUAI 19" : (root.querySelector('.view[data-view="' + name + '"]').getAttribute("aria-label") + " — QUAI 19");
    if (moveFocus) {
      window.scrollTo(0, 0);
      var h1 = root.querySelector('.view[data-view="' + name + '"] h1');
      if (h1) h1.focus({ preventScroll: true });
    }
  }
  window.addEventListener("hashchange", function () { show(true); });
  render();

  // Recrée la page complète avec les nouvelles coordonnées (pour la republier)
  function documentFor(next) {
    var css = document.getElementById("q19-style").textContent;
    var js = document.getElementById("q19-app").textContent;
    var json = JSON.stringify({ email: next.email, telephone: next.telephone }).replace(/</g, "\\u003c");
    var close = "</" + "script>";
    return "<!doctype html><html><head><meta charset=utf8><meta name=viewport content=\"width=device-width,initial-scale=1,viewport-fit=cover\"><style>" +
      ":root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}" +
      "</style></head><body>" +
      "<title>QUAI 19</title><meta name=\"claude:viewport-fit-sides\" content=\"cover\">" +
      '<style id="q19-style">' + css + "</style>" +
      '<template id="q19-site">' + tpl.innerHTML + "</" + "template>" +
      '<div id="q19-root"></div>' +
      '<script type="application/json" id="q19-state">' + json + close +
      '<script id="q19-app">' + js + close +
      "</body></html>";
  }

  // Espace propriétaire : modifier l'e-mail et le téléphone affichés sur le site
  (async function () {
    var use = window.claude && window.claude.use;
    if (!use) return;
    var user = await window.claude.use("user");
    if (!user) return;
    var allowed = false;
    try { allowed = (await user.isOwner()) || (await user.canEdit()); } catch (e) { allowed = false; }
    if (!allowed) return;

    var toggle = document.createElement("button");
    toggle.type = "button";
    toggle.className = "owner-toggle";
    toggle.textContent = "Modifier mes coordonnées";
    toggle.setAttribute("aria-expanded", "false");
    toggle.setAttribute("aria-controls", "q19-owner");

    var panel = document.createElement("form");
    panel.id = "q19-owner";
    panel.className = "owner-panel";
    panel.hidden = true;
    panel.noValidate = true;
    panel.innerHTML =
      "<h2>Mes coordonnées</h2>" +
      '<p class="small muted">Visible uniquement par vous. Laissez un champ vide pour le masquer du site.</p>' +
      '<label for="q19-email">Adresse e-mail</label><input id="q19-email" type="email" autocomplete="email" maxlength="120">' +
      '<label for="q19-tel">Téléphone</label><input id="q19-tel" type="tel" autocomplete="tel" maxlength="30">' +
      '<div class="row"><button type="submit" class="save">Enregistrer sur le site</button><button type="button" class="cancel">Fermer</button></div>' +
      '<p class="owner-msg" role="status" aria-live="polite"></p>';
    document.body.appendChild(panel);
    document.body.appendChild(toggle);

    var emailIn = panel.querySelector("#q19-email"), telIn = panel.querySelector("#q19-tel"), msg = panel.querySelector(".owner-msg"), save = panel.querySelector(".save");
    function open(v) {
      panel.hidden = !v; toggle.setAttribute("aria-expanded", String(v));
      if (v) { emailIn.value = state.email; telIn.value = state.telephone; msg.textContent = ""; emailIn.focus(); }
    }
    toggle.addEventListener("click", function () { open(panel.hidden); });
    panel.querySelector(".cancel").addEventListener("click", function () { open(false); toggle.focus(); });

    panel.addEventListener("submit", async function (ev) {
      ev.preventDefault();
      var email = emailIn.value.trim(), tel = telIn.value.trim();
      msg.className = "owner-msg error";
      if (email && !/^[^\s@<>"]+@[^\s@<>"]+\.[^\s@<>"]+$/.test(email)) { msg.textContent = "Adresse e-mail invalide (exemple : contact@quai19.fr)."; emailIn.focus(); return; }
      if (tel && !/^[+0-9 ().-]{6,30}$/.test(tel)) { msg.textContent = "Numéro invalide : chiffres, espaces et + uniquement (exemple : 04 78 00 00 00)."; telIn.focus(); return; }
      if (email === state.email && tel === state.telephone) { msg.className = "owner-msg"; msg.textContent = "Aucun changement à enregistrer."; return; }
      var artifact = await window.claude.use("artifact");
      if (!artifact) { msg.textContent = "Modification impossible depuis cet affichage. Ouvrez le site depuis votre compte Claude."; return; }
      save.disabled = true; msg.className = "owner-msg"; msg.textContent = "Enregistrement…";
      try {
        await artifact.publish(documentFor({ email: email, telephone: tel }));
        msg.textContent = "Enregistré : le site se met à jour.";
      } catch (e) {
        msg.className = "owner-msg error";
        var code = e && e.code;
        msg.textContent = code === "conflict" ? "Une autre modification vient d'être enregistrée. Rechargez la page puis recommencez."
          : (code === "not_writer" || code === "not_granted") ? "Votre compte n'a pas le droit de modifier ce site."
          : "L'enregistrement a échoué. Réessayez dans un instant.";
        save.disabled = false;
      }
    });
  })();
})();
</script>
