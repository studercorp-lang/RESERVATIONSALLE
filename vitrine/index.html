<title>QUAI 19</title>

<style id="q19-style">
/* Mise en page : en-tête avec le logo, une colonne de contenu, cartes pour les salles et infos pratiques.
   Couleurs du logo : sauge #98ae79 et beige #dcccac (décor) ; sauge foncé #556341 pour textes et boutons (contraste ≥ 4,5:1). */
:root {
  --brand: #556341; --brand-dark: #4a5638; --brand-soft: #eef1e6; --sage: #98ae79; --beige: #dcccac;
  --ink: #23261d; --muted: #5a5c52; --surface: #f7f5ef; --line: #ddd8cb; --paper: #ffffff; --danger: #b42318;
  --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --radius: 8px;
  color-scheme: light;
}
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; background: var(--surface); color: var(--ink); font: 16px/1.6 var(--font); }
a { color: var(--brand); }
:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }
h1[tabindex="-1"]:focus { outline: none; } /* titre focalisé au changement de rubrique (lecteurs d'écran) */
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
.wrap { max-width: 1040px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.skip { position: absolute; left: -9999px; }
.skip:focus { left: 8px; top: 8px; z-index: 10; background: var(--paper); padding: 8px 12px; border-radius: var(--radius); }
.site-header { background: var(--paper); border-bottom: 1px solid var(--line); }
.header-inner { display: flex; align-items: center; justify-content: space-between; gap: 8px 20px; flex-wrap: wrap; min-height: 72px; }
.site-header { border-top: 4px solid var(--sage); }
.logo { display: block; line-height: 0; padding-block: 8px; }
.logo img { height: 55px; width: auto; max-width: 100%; }
.site-header ul { display: flex; gap: 20px; list-style: none; margin: 0; padding: 0; font-weight: 500; }
.site-header nav a { color: var(--ink); text-decoration: none; }
.site-header nav a:hover, .site-header nav a[aria-current="page"] { text-decoration: underline; text-underline-offset: 4px; }
main { padding-block: 32px 48px; }
h1 { font-size: clamp(1.75rem, 5vw, 2.5rem); line-height: 1.15; margin: 0 0 12px; text-wrap: balance; }
h2, .h3 { margin: 40px 0 12px; text-wrap: balance; }
h2 { font-size: 1.5rem; }
h3, .h3 { font-size: 1.125rem; }
.card h2.h3, .card h3 { margin-top: 0; }
.card h3 + p, .card h2 + p { margin-top: 4px; }
p { margin: 0 0 12px; }
.eyebrow { text-transform: uppercase; letter-spacing: 0.12em; font-size: 0.8rem; color: var(--brand); font-weight: 600; margin-bottom: 8px; }
.lead { font-size: 1.15rem; color: var(--muted); max-width: 40rem; }
.muted { color: var(--muted); }
.small { font-size: 0.875rem; }
.actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 20px; }
.button, .button-secondary { display: inline-block; font-weight: 600; text-decoration: none; padding: 13px 20px; border-radius: var(--radius); }
.button { background: var(--brand); color: #fff; border: 1px solid var(--brand); }
.button:hover { background: var(--brand-dark); }
.button-secondary { background: var(--paper); color: var(--ink); border: 1px solid var(--line); }
.card { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; min-width: 0; }
.grid { display: grid; gap: 16px; }
@media (min-width: 720px) { .grid-3 { grid-template-columns: repeat(3, 1fr); } .grid-2 { grid-template-columns: repeat(2, 1fr); } }
section.grid { margin-top: 40px; }
.plain { list-style: none; padding: 0; margin: 0; }
.room { display: flex; flex-direction: column; gap: 6px; }
.room h3 { margin: 10px 0 0; }
.room p { margin: 0; }
.text-link { margin-top: auto; padding-top: 8px; font-weight: 600; }
.photo-placeholder { aspect-ratio: 16 / 9; max-width: 100%; border-radius: 6px; display: flex; align-items: center; justify-content: center;
  background: linear-gradient(135deg, var(--brand-soft), var(--beige)); color: var(--brand); font-weight: 700; letter-spacing: 0.1em; font-size: 1.35rem; }
.prices { margin: 0; display: grid; gap: 12px; }
.prices div { display: grid; gap: 2px; }
.prices dt { font-size: 0.875rem; color: var(--muted); }
.prices dd { margin: 0; }
.steps { counter-reset: step; list-style: none; margin: 0; display: grid; gap: 14px; }
.steps li { counter-increment: step; position: relative; padding-left: 46px; min-height: 34px; }
.steps li::before { content: counter(step); position: absolute; left: 0; top: -2px; width: 32px; height: 32px; border-radius: 50%;
  background: var(--brand); color: #fff; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.notice-rgpd { margin-top: 24px; max-width: 46rem; }
.selectable { user-select: all; }
.legal { max-width: 46rem; }
.legal h2 { font-size: 1.25rem; margin-top: 28px; }
.legal ul, .legal ol { padding-left: 1.4rem; }
.legal table { width: 100%; border-collapse: collapse; display: block; overflow-x: auto; }
.legal th, .legal td { border: 1px solid var(--line); padding: 8px; text-align: left; vertical-align: top; }
.legal th { background: var(--surface); }
.site-footer { background: var(--paper); border-top: 1px solid var(--line); font-size: 0.9rem; color: var(--muted); padding-block: 24px; }
.footer-inner { display: flex; flex-direction: column; gap: 12px; }
.footer-inner p { margin: 0 0 4px; }
@media (min-width: 720px) { .footer-inner { flex-direction: row; justify-content: space-between; } }
.site-footer ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 4px 16px; }
.site-footer strong { color: var(--ink); }
/* Espace propriétaire (visible uniquement pour la propriétaire du site) */
.owner-toggle { position: fixed; right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 20;
  background: var(--ink); color: #fff; border: 0; border-radius: 999px; padding: 12px 18px; font: 600 0.9rem var(--font); cursor: pointer; box-shadow: 0 4px 16px rgb(0 0 0 / 0.2); }
.owner-panel { position: fixed; right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(72px + env(safe-area-inset-bottom, 0px)); z-index: 20;
  width: min(360px, calc(100vw - 32px)); background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; box-shadow: 0 8px 32px rgb(0 0 0 / 0.18); }
.owner-panel h2 { margin: 0 0 4px; font-size: 1.05rem; }
.owner-panel label { display: block; font-weight: 600; font-size: 0.9rem; margin-top: 12px; }
.owner-panel input { width: 100%; font: inherit; padding: 10px; border: 1px solid var(--line); border-radius: 6px; margin-top: 4px; background: var(--paper); color: var(--ink); }
.owner-panel .row { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
.owner-panel button { font: 600 0.95rem var(--font); padding: 10px 16px; border-radius: 6px; cursor: pointer; }
.owner-panel .save { background: var(--brand); color: #fff; border: 1px solid var(--brand); }
.owner-panel .cancel { background: var(--paper); color: var(--ink); border: 1px solid var(--line); }
.owner-msg { margin-top: 10px; font-size: 0.875rem; }
.owner-msg.error { color: var(--danger); }
</style>

<!-- ✏️ VOS COORDONNÉES : modifiez uniquement la ligne suivante (laissez "" pour masquer) -->
<script type="application/json" id="q19-state">{"email":"studercorp@gmail.com","telephone":"0783616497"}</script>
<script id="q19-app">
(function () {
  "use strict";
  document.documentElement.lang = "fr"; // langue de la page (lecteurs d'écran, traduction automatique)
  var stateEl = document.getElementById("q19-state");
  var state = { email: "", telephone: "" };
  try { var parsed = JSON.parse(stateEl.textContent); state.email = String(parsed.email || ""); state.telephone = String(parsed.telephone || ""); } catch (e) {}
  var tpl = document.getElementById("q19-site");
  var root = document.getElementById("q19-root");
  var VIEWS = ["accueil","salles","reserver","informations-legales"];
  var ALIASES = {"mentions-legales":"informations-legales","confidentialite":"informations-legales","conditions":"informations-legales"}; // anciennes adresses redirigées

  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }

  // Remplit le gabarit avec les coordonnées actuelles
  function render() {
    var email = state.email.trim(), tel = state.telephone.trim();
    var emailTexte = email ? '<a href="mailto:' + esc(email) + '" class="selectable">' + esc(email) + "</a>" : "l'adresse e-mail indiquée en bas de page";
    root.innerHTML = tpl.innerHTML
      .split("{{EMAIL_TEXTE}}").join(emailTexte)
      .split("{{EMAIL_HREF}}").join(esc("mailto:" + email))
      .split("{{EMAIL}}").join(esc(email))
      .split("{{TEL_HREF}}").join(esc("tel:" + tel.replace(/[^0-9+]/g, "")))
      .split("{{TEL}}").join(esc(tel));
    root.querySelectorAll('[data-si="email"]').forEach(function (el) { el.hidden = !email; });
    root.querySelectorAll('[data-si="tel"]').forEach(function (el) { el.hidden = !tel; });
    root.querySelectorAll('[data-si="contact"]').forEach(function (el) { el.hidden = !email && !tel; });
    show(false);
  }

  // Affiche la rubrique correspondant à l'adresse (#salles, #reserver…)
  function show(moveFocus) {
    var name = location.hash.slice(1);
    if (ALIASES[name]) name = ALIASES[name];
    if (VIEWS.indexOf(name) === -1) name = "accueil";
    root.querySelectorAll(".view").forEach(function (v) { v.hidden = v.getAttribute("data-view") !== name; });
    root.querySelectorAll("[data-nav]").forEach(function (a) {
      if (a.getAttribute("data-nav") === name) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
    });
    document.title = name === "accueil" ? "QUAI 19" : (root.querySelector('.view[data-view="' + name + '"]').getAttribute("aria-label") + " — QUAI 19");
    if (moveFocus) {
      window.scrollTo(0, 0);
      var h1 = root.querySelector('.view[data-view="' + name + '"] h1');
      if (h1) h1.focus({ preventScroll: true });
    }
  }
  window.addEventListener("hashchange", function () { show(true); });
  render();

  // Recrée la page complète avec les nouvelles coordonnées (pour la republier)
  function documentFor(next) {
    var css = document.getElementById("q19-style").textContent;
    var js = document.getElementById("q19-app").textContent;
    var json = JSON.stringify({ email: next.email, telephone: next.telephone }).replace(/</g, "\\u003c");
    var close = "</" + "script>";
    return "<!doctype html><html><head><meta charset=utf8><meta name=viewport content=\"width=device-width,initial-scale=1,viewport-fit=cover\"><style>" +
      ":root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}" +
      "</style></head><body>" +
      "<title>QUAI 19</title><meta name=\"claude:viewport-fit-sides\" content=\"cover\">" +
      '<style id="q19-style">' + css + "</style>" +
      '<template id="q19-site">' + tpl.innerHTML + "</" + "template>" +
      '<div id="q19-root"></div>' +
      '<script type="application/json" id="q19-state">' + json + close +
      '<script id="q19-app">' + js + close +
      "</body></html>";
  }

  // Espace propriétaire : modifier l'e-mail et le téléphone affichés sur le site
  (async function () {
    var use = window.claude && window.claude.use;
    if (!use) return;
    var user = await window.claude.use("user");
    if (!user) return;
    var allowed = false;
    try { allowed = (await user.isOwner()) || (await user.canEdit()); } catch (e) { allowed = false; }
    if (!allowed) return;

    var toggle = document.createElement("button");
    toggle.type = "button";
    toggle.className = "owner-toggle";
    toggle.textContent = "Modifier mes coordonnées";
    toggle.setAttribute("aria-expanded", "false");
    toggle.setAttribute("aria-controls", "q19-owner");

    var panel = document.createElement("form");
    panel.id = "q19-owner";
    panel.className = "owner-panel";
    panel.hidden = true;
    panel.noValidate = true;
    panel.innerHTML =
      "<h2>Mes coordonnées</h2>" +
      '<p class="small muted">Visible uniquement par vous. Laissez un champ vide pour le masquer du site.</p>' +
      '<label for="q19-email">Adresse e-mail</label><input id="q19-email" type="email" autocomplete="email" maxlength="120">' +
      '<label for="q19-tel">Téléphone</label><input id="q19-tel" type="tel" autocomplete="tel" maxlength="30">' +
      '<div class="row"><button type="submit" class="save">Enregistrer sur le site</button><button type="button" class="cancel">Fermer</button></div>' +
      '<p class="owner-msg" role="status" aria-live="polite"></p>';
    document.body.appendChild(panel);
    document.body.appendChild(toggle);

    var emailIn = panel.querySelector("#q19-email"), telIn = panel.querySelector("#q19-tel"), msg = panel.querySelector(".owner-msg"), save = panel.querySelector(".save");
    function open(v) {
      panel.hidden = !v; toggle.setAttribute("aria-expanded", String(v));
      if (v) { emailIn.value = state.email; telIn.value = state.telephone; msg.textContent = ""; emailIn.focus(); }
    }
    toggle.addEventListener("click", function () { open(panel.hidden); });
    panel.querySelector(".cancel").addEventListener("click", function () { open(false); toggle.focus(); });

    panel.addEventListener("submit", async function (ev) {
      ev.preventDefault();
      var email = emailIn.value.trim(), tel = telIn.value.trim();
      msg.className = "owner-msg error";
      if (email && !/^[^\s@<>"]+@[^\s@<>"]+\.[^\s@<>"]+$/.test(email)) { msg.textContent = "Adresse e-mail invalide (exemple : contact@quai19.fr)."; emailIn.focus(); return; }
      if (tel && !/^[+0-9 ().-]{6,30}$/.test(tel)) { msg.textContent = "Numéro invalide : chiffres, espaces et + uniquement (exemple : 04 78 00 00 00)."; telIn.focus(); return; }
      if (email === state.email && tel === state.telephone) { msg.className = "owner-msg"; msg.textContent = "Aucun changement à enregistrer."; return; }
      var artifact = await window.claude.use("artifact");
      if (!artifact) { msg.textContent = "Modification impossible depuis cet affichage. Ouvrez le site depuis votre compte Claude."; return; }
      save.disabled = true; msg.className = "owner-msg"; msg.textContent = "Enregistrement…";
      try {
        await artifact.publish(documentFor({ email: email, telephone: tel }));
        msg.textContent = "Enregistré : le site se met à jour.";
      } catch (e) {
        msg.className = "owner-msg error";
        var code = e && e.code;
        msg.textContent = code === "conflict" ? "Une autre modification vient d'être enregistrée. Rechargez la page puis recommencez."
          : (code === "not_writer" || code === "not_granted") ? "Votre compte n'a pas le droit de modifier ce site."
          : "L'enregistrement a échoué. Réessayez dans un instant.";
        save.disabled = false;
      }
    });
  })();
})();
</script>
